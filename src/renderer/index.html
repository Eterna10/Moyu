<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src * file: data: blob:; font-src 'self' data: file:; media-src * file: data: blob:; connect-src 'self'">
  <title>Moyu</title>
  <script src="js/splash.js"></script>
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css">
  <link rel="stylesheet" id="hljs-light" href="../../node_modules/@highlightjs/cdn-assets/styles/github.min.css">
  <link rel="stylesheet" id="hljs-dark" href="../../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/markdown.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme-moyu.css">
</head>
<body data-theme="github">
  <div id="splash" aria-hidden="true">
    <div class="splash-glow"></div>
    <div class="splash-inner">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="../../build/icon.png" alt="" draggable="false">
        <span class="splash-spark s1">✦</span><span class="splash-spark s2">✦</span><span class="splash-spark s3">✧</span>
      </div>
      <div class="splash-name">Moyu</div>
      <div class="splash-sub">所见即所得的 Markdown 编辑器</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>
  <div id="app">
    <div id="main">
      <aside id="sidebar">
        <div class="side-tabs">
          <button class="side-tab" data-tab="files" title="文件 (Ctrl+Shift+3)">文件</button>
          <button class="side-tab" data-tab="outline" title="大纲 (Ctrl+Shift+1)">大纲</button>
          <button class="side-tab" data-tab="search" title="在文件夹中查找 (Ctrl+Shift+F)">搜索</button>
        </div>
        <div class="side-panel" id="panel-files">
          <div class="folder-head">
            <span id="folder-name" class="folder-name">未打开文件夹</span>
            <span class="folder-actions">
              <button class="icon-btn" id="btn-new-file" title="新建文件或文件夹">＋</button>
              <button class="icon-btn" id="btn-refresh" title="刷新">⟳</button>
              <button class="icon-btn" id="btn-open-folder" title="打开文件夹">📂</button>
            </span>
          </div>
          <div id="file-tree" class="file-tree"></div>
        </div>
        <div class="side-panel" id="panel-outline">
          <div id="outline" class="outline"></div>
        </div>
        <div class="side-panel" id="panel-search">
          <div class="search-box">
            <input id="search-input" type="text" placeholder="在文件夹中查找" spellcheck="false">
            <button class="icon-btn toggle" id="search-case" title="区分大小写">Aa</button>
            <button class="icon-btn toggle" id="search-regex" title="正则表达式">.*</button>
          </div>
          <div id="search-status" class="search-status"></div>
          <div id="search-results" class="search-results"></div>
        </div>
      </aside>
      <div id="resizer" title="拖动调整侧边栏宽度"></div>
      <section id="content-wrap">
        <div id="tabbar" hidden></div>
        <div id="content" class="scroller">
          <article id="write" class="markdown-body" spellcheck="false"></article>
        </div>
        <div id="source" class="scroller" hidden></div>

        <div id="findbar" hidden>
          <div class="find-row">
            <input id="find-input" type="text" placeholder="查找" spellcheck="false">
            <span id="find-count" class="find-count"></span>
            <button class="find-opt" id="find-case" title="区分大小写">Aa</button>
            <button class="find-opt" id="find-regex" title="正则表达式">.*</button>
            <button class="icon-btn" id="find-prev" title="上一个 (Shift+Enter)">↑</button>
            <button class="icon-btn" id="find-next" title="下一个 (Enter)">↓</button>
            <button class="icon-btn" id="find-toggle-replace" title="替换 (Ctrl+H)">⇄</button>
            <button class="icon-btn" id="find-close" title="关闭 (Esc)">✕</button>
          </div>
          <div class="find-row" id="replace-row" hidden>
            <input id="replace-input" type="text" placeholder="替换为" spellcheck="false">
            <button class="text-btn" id="replace-one">替换</button>
            <button class="text-btn" id="replace-all">全部替换</button>
          </div>
        </div>
      </section>
    </div>
    <!-- 「墨羽蓝调」主题的日间 / 夜间切换（只在该主题下显示） -->
    <button id="moyu-mode" type="button" title="切换日间 / 夜间" aria-label="切换日间 / 夜间">
      <span class="mm-knob"></span>
      <svg class="mm-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="mm-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a.6.6 0 0 0-.8-.7 9.8 9.8 0 1 0 12.5 12.5.6.6 0 0 0-.7-.8z"/></svg>
    </button>
    <footer id="statusbar">
      <div class="status-left">
        <button class="status-btn" id="sb-sidebar" title="侧边栏 (Ctrl+Shift+L)">☰</button>
        <button class="status-btn" id="sb-source" title="源代码模式 (Ctrl+/)">&lt;/&gt;</button>
        <button class="status-btn" id="sb-rich" title="纯文本模式：编辑时不显示 Markdown 源码 (F7)">纯文本</button>
        <button class="status-btn" id="sb-focus" title="专注模式 (F8)">专注</button>
        <button class="status-btn" id="sb-typewriter" title="打字机模式 (F9)">打字机</button>
      </div>
      <div class="status-right">
        <button class="status-btn update-btn" id="sb-update" hidden></button>
        <span id="sb-plugins" class="sb-plugins"></span>
        <span id="sb-selection"></span>
        <span id="sb-count">字数 0</span>
        <span id="sb-save" class="save-state">未保存</span>
      </div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="../../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script src="../../node_modules/markdown-it-footnote/dist/markdown-it-footnote.min.js"></script>
  <script src="../../node_modules/katex/dist/katex.min.js"></script>
  <script src="../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../../node_modules/mermaid/dist/mermaid.min.js"></script>
  <script src="js/md.js"></script>
  <script src="js/hltextarea.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/richmode.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/aiprompt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
